<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>個案狀況主動回報系統</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; font-family: "Microsoft JhengHei", sans-serif; }
        .card { border-radius: 12px; margin-bottom: 20px; border: none; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .card-header { background-color: #4CAF50; color: white; border-radius: 12px 12px 0 0 !important; font-weight: bold; }
        .urgency-radio input[type="radio"] { display: none; }
        .urgency-radio label { cursor: pointer; padding: 10px; border: 2px solid #ddd; border-radius: 8px; display: block; margin-bottom: 10px; }
        .urgency-radio input[type="radio"]:checked + label { border-color: #4CAF50; background-color: #e8f5e9; }
        
        /* 隱藏連動區塊的預設樣式 */
        .conditional-field { display: none; margin-top: 10px; padding: 10px; background-color: #f1f8e9; border-radius: 8px; border-left: 4px solid #4CAF50; }
    </style>
</head>
<body>
<div class="container py-4">
    <h2 class="text-center mb-4">個案近期狀況回報</h2>
    
    <!-- 已更新為您的 Formspree 連結 -->
    <form action="https://formspree.io/f/mvkkggvn" method="POST">
        
        <!-- 基本資訊 -->
        <div class="card">
            <div class="card-header">基本資訊</div>
            <div class="card-body">
                <div class="mb-3">
                    <label class="form-label">個案編號 (系統自動帶入)</label>
                    <input type="text" class="form-control" id="case_id" name="個案編號" readonly>
                </div>
                <div class="mb-3">
                    <label class="form-label">長輩姓名</label>
                    <input type="text" class="form-control" name="長輩姓名" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">填寫人 / 與個案關係</label>
                    <input type="text" class="form-control" name="填寫人關係" placeholder="例如：王小明 / 兒子" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">聯絡電話</label>
                    <input type="tel" class="form-control" name="聯絡電話" required>
                </div>
            </div>
        </div>

        <!-- 聯繫急迫性與時間 -->
        <div class="card border-warning">
            <div class="card-header bg-warning text-dark">聯繫急迫性與時間</div>
            <div class="card-body">
                <label class="form-label fw-bold">本次填寫事由急迫性：</label>
                <div class="urgency-radio">
                    <input type="radio" id="urg1" name="急迫性" value="例行回報" required>
                    <label for="urg1">🟢 例行狀況回報（目前狀況穩定，無需個管回電）</label>
                    
                    <input type="radio" id="urg2" name="急迫性" value="一般討論">
                    <label for="urg2">🟡 一般事項討論（有服務或個案狀況想與個管討論）</label>
                    
                    <input type="radio" id="urg3" name="急迫性" value="緊急協助">
                    <label for="urg3">🔴 緊急需協助（個案有突發狀況或重大服務變更，需儘速聯繫）</label>
                </div>
                <div class="mb-3 mt-3">
                    <label class="form-label fw-bold">方便個管回電的時間區間：</label>
                    <select class="form-select" name="方便回電時間">
                        <option value="無需回電">無需回電</option>
                        <option value="09:00-12:00">早上 09:00-12:00</option>
                        <option value="14:00-17:00">下午 14:00-17:00</option>
                        <option value="18:00-21:00">晚上 18:00-21:00</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- 一、身體健康狀況 -->
        <div class="card">
            <div class="card-header">一、身體健康狀況</div>
            <div class="card-body">
                <label class="form-label">目前狀況 (可複選)：</label>
                <div class="form-check"><input class="form-check-input" type="checkbox" name="健康狀況[]" value="穩定"><label class="form-check-label">穩定</label></div>
                <div class="form-check"><input class="form-check-input" type="checkbox" name="健康狀況[]" value="發燒/感冒"><label class="form-check-label">發燒/感冒</label></div>
                <div class="form-check"><input class="form-check-input" type="checkbox" name="健康狀況[]" value="腸胃不適"><label class="form-check-label">腸胃不適</label></div>
                <div class="form-check"><input class="form-check-input" type="checkbox" name="健康狀況[]" value="皮膚狀況"><label class="form-check-label">皮膚狀況 (破皮/紅疹)</label></div>
                <div class="form-check"><input class="form-check-input" type="checkbox" name="健康狀況[]" value="血壓或血糖不穩"><label class="form-check-label">血壓或血糖不穩定</label></div>
                <div class="mb-3 mt-2">
                    <label class="form-label">近期就醫狀況 (近一週內是否有門診/急診/住院)：</label>
                    <textarea class="form-control" name="就醫狀況說明" rows="2" placeholder="無，或請簡述..."></textarea>
                </div>
            </div>
        </div>

        <!-- 二、睡眠與情緒狀況 -->
        <div class="card">
            <div class="card-header">二、睡眠與情緒狀況</div>
            <div class="card-body">
                <label class="form-label">睡眠品質：</label>
                <select class="form-select mb-3" name="睡眠品質">
                    <option value="穩定">穩定</option>
                    <option value="入睡困難">入睡困難</option>
                    <option value="夜間易醒">夜間易醒</option>
                    <option value="日夜顛倒">日夜顛倒</option>
                </select>
                <label class="form-label">情緒與精神狀態：</label>
                <select class="form-select" name="情緒狀態">
                    <option value="平穩">情緒平穩</option>
                    <option value="低落">心情低落</option>
                    <option value="焦慮躁動">焦慮躁動 / 易怒</option>
                </select>
            </div>
        </div>

        <!-- 三、飲食與吞嚥安全 -->
        <div class="card">
            <div class="card-header">三、飲食與吞嚥安全</div>
            <div class="card-body">
                <label class="form-label">食慾與進食量：</label>
                <select class="form-select mb-3" name="食慾與進食量">
                    <option value="正常">正常</option>
                    <option value="食慾佳">食慾佳</option>
                    <option value="較平時減少">較平時減少</option>
                    <option value="明顯進食困難">明顯進食困難</option>
                </select>
                <label class="form-label text-danger fw-bold">吞嚥與飲水安全 (關鍵指標)：</label>
                <select class="form-select" name="吞嚥安全">
                    <option value="無異常">無異常</option>
                    <option value="偶有嗆咳">偶有嗆咳</option>
                    <option value="吞嚥困難">吞嚥困難</option>
                </select>
            </div>
        </div>

        <!-- 居家安全與用藥風險 -->
        <div class="card">
            <div class="card-header">四、安全與用藥風險預警</div>
            <div class="card-body">
                <div class="mb-3">
                    <label class="form-label">近期是否有跌倒、絆倒或差點跌倒？</label>
                    <select class="form-select" name="跌倒紀錄">
                        <option value="否">否</option>
                        <option value="是">是</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">目前用藥狀況：</label>
                    <select class="form-select" name="用藥狀況">
                        <option value="按時服藥">按時服藥</option>
                        <option value="藥物剩餘過多">藥物剩餘過多 (漏吃)</option>
                        <option value="自行停藥或重複就醫">有自行停藥或重複就醫開藥情形</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- 照顧者負荷 -->
        <div class="card">
            <div class="card-header">五、照顧者支持與需求</div>
            <div class="card-body">
                <label class="form-label">照顧者自我感覺：</label>
                <select class="form-select mb-3" name="照顧者負荷">
                    <option value="負荷尚可">負荷尚可</option>
                    <option value="感到疲憊身心俱疲">感到疲憊身心俱疲</option>
                    <option value="需要尋求諮詢或心理支持">需要尋求諮詢或心理支持</option>
                </select>
                
                <label class="form-label">是否需要調整服務或申請喘息？</label>
                <select class="form-select" id="service_adjust" name="服務調整需求" onchange="toggleServiceFields()">
                    <option value="無">目前不需要</option>
                    <option value="需要">需要討論服務調整或喘息</option>
                </select>

                <!-- 連動展開區塊 -->
                <div id="service_details" class="conditional-field">
                    <label class="form-label">需求類別 (可複選)：</label>
                    <div class="form-check"><input class="form-check-input" type="checkbox" name="調整細項[]" value="增減服務項目"><label class="form-check-label">增減服務項目</label></div>
                    <div class="form-check"><input class="form-check-input" type="checkbox" name="調整細項[]" value="調整服務時間"><label class="form-check-label">調整服務時間</label></div>
                    <div class="form-check"><input class="form-check-input" type="checkbox" name="調整細項[]" value="居家喘息"><label class="form-check-label">申請居家喘息</label></div>
                    <div class="form-check"><input class="form-check-input" type="checkbox" name="調整細項[]" value="機構喘息"><label class="form-check-label">申請機構喘息</label></div>
                    <input type="text" class="form-control mt-2" name="需求備註" placeholder="請簡述希望的日期、時段或單位">
                </div>
            </div>
        </div>

        <!-- 送出按鈕 -->
        <div class="d-grid gap-2 mb-5">
            <button class="btn btn-success btn-lg" type="submit">送出回報資料</button>
        </div>
    </form>
</div>

<script>
    // 預填個案編號
    const urlParams = new URLSearchParams(window.location.search);
    if(urlParams.has('caseid')) {
        document.getElementById('case_id').value = urlParams.get('caseid');
    }

    // 控制服務需求連動區塊的顯示/隱藏
    function toggleServiceFields() {
        const selectBox = document.getElementById("service_adjust");
        const detailSection = document.getElementById("service_details");
        if (selectBox.value === "需要") {
            detailSection.style.display = "block";
        } else {
            detailSection.style.display = "none";
        }
    }
</script>
</body>
</html>
