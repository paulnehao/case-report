<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>長照家屬主動回饋與健康狀況填報系統</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts Noto Sans TC -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #f0f4f8;
            color: #334155;
        }
        .header-bg {
            background: linear-gradient(135deg, #0d9488 0%, #0f766e 100%);
            color: white;
            border-radius: 0 0 1.5rem 1.5rem;
            padding: 2.5rem 1rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .card-custom {
            border: none;
            border-radius: 1rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -4px rgba(0, 0, 0, 0.05);
            transition: all 0.3s ease;
        }
        .form-check-input:checked {
            background-color: #0d9488;
            border-color: #0d9488;
        }
        .form-control:focus, .form-select:focus {
            border-color: #0d9488;
            box-shadow: 0 0 0 0.25rem rgba(13, 148, 136, 0.25);
        }
        .btn-primary-custom {
            background-color: #0d9488;
            border-color: #0d9488;
            color: white;
            font-weight: 600;
            padding: 0.75rem 1.5rem;
            border-radius: 0.75rem;
            transition: all 0.2s;
        }
        .btn-primary-custom:hover {
            background-color: #0f766e;
            border-color: #0f766e;
            color: white;
        }
        .section-title {
            font-weight: 700;
            color: #115e59;
            border-bottom: 2px solid #ccfbf1;
            padding-bottom: 0.5rem;
            margin-bottom: 1.25rem;
        }
        .conditional-box {
            background-color: #f8fafc;
            border-left: 4px solid #0d9488;
            padding: 1rem;
            border-radius: 0.5rem;
            margin-top: 0.75rem;
            display: none; /* 預設隱藏 */
        }
        .success-overlay {
            display: none;
        }
    </style>
</head>
<body>

    <!-- 頂部標頭 -->
    <div class="header-bg text-center mb-4">
        <div class="container">
            <span class="badge bg-light text-teal mb-2 px-3 py-2 rounded-pill fw-bold text-dark shadow-sm">
                <i class="fa-solid fa-hands-holding-child me-1 text-teal"></i> 家屬溫馨連線與關懷回饋
            </span>
            <h1 class="h3 fw-bold mb-2">長輩健康與服務使用狀況填報</h1>
            <p class="mb-0 text-light opacity-75">免去電話聯繫的等候，主動線上回報</p>
        </div>
    </div>

    <div class="container pb-5">
        <div class="row justify-content-center">
            <div class="col-lg-8 col-md-10">
                
                <!-- 填寫表單主卡片 -->
                <div class="card card-custom p-4 p-md-5 bg-white mb-4" id="formCard">
                    
                    <form id="feedbackForm" action="https://formspree.io/f/mvkkggvn" method="POST">
                        
                        <!-- 基本資料區塊 -->
                        <div class="mb-5">
                            <h4 class="section-title"><i class="fa-solid fa-user-pen me-2"></i>基本資料填寫</h4>
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label for="elderName" class="form-label fw-bold">長輩姓名 <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" id="elderName" name="長輩姓名" required placeholder="請輸入長輩全名">
                                </div>
                                <div class="col-md-6">
                                    <label for="fillDate" class="form-label fw-bold">填寫日期 <span class="text-danger">*</span></label>
                                    <input type="date" class="form-control" id="fillDate" name="填寫日期" required>
                                </div>
                                <div class="col-md-6">
                                    <label for="relationSelect" class="form-label fw-bold">填寫人與個案關係 <span class="text-danger">*</span></label>
                                    <select class="form-select" id="relationSelect" name="填寫人與個案關係" required>
                                        <option value="" selected disabled>請選擇關係</option>
                                        <option value="配偶">配偶</option>
                                        <option value="案子">案子 (兒子)</option>
                                        <option value="案女">案女 (女兒)</option>
                                        <option value="其他">其他</option>
                                    </select>
                                    <!-- 選擇「其他」時跳出的自訂輸入框 -->
                                    <div class="mt-2" id="otherRelationDiv" style="display: none;">
                                        <input type="text" class="form-control" id="otherRelationInput" name="填寫人關係其他說明" placeholder="請註明與個案關係（例如：媳婦、孫女）">
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <label for="unit" class="form-label fw-bold">指定單位 / 據點</label>
                                    <input type="text" class="form-control" id="unit" name="指定單位" placeholder="例如：日照中心 / 居家服務單位">
                                </div>
                            </div>
                        </div>

                        <!-- 一、身體健康狀況 -->
                        <div class="mb-5">
                            <h4 class="section-title"><i class="fa-solid fa-heart-pulse me-2"></i>一、身體健康狀況</h4>
                            <div class="d-flex flex-column gap-3">
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="身體健康狀況" id="health1" value="穩定(無新病徵或急性症狀)" checked>
                                    <label class="form-check-label" for="health1">1. 穩定 (無新病徵或急性症狀)</label>
                                </div>
                                
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="身體健康狀況" id="health2" value="微恙">
                                    <label class="form-check-label" for="health2">2. 微恙 (小病痛)</label>
                                    <div class="conditional-box" id="box-health2">
                                        <input type="text" class="form-control" name="微恙說明" placeholder="請簡述微恙狀況（例如：輕微感冒、流鼻水）">
                                    </div>
                                </div>

                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="身體健康狀況" id="health3" value="新病症">
                                    <label class="form-check-label" for="health3">3. 新病症</label>
                                    <div class="conditional-box" id="box-health3">
                                        <input type="text" class="form-control" name="新病症疾病" placeholder="請填寫新發生之疾病名稱">
                                    </div>
                                </div>

                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="身體健康狀況" id="health4" value="急診">
                                    <label class="form-check-label" for="health4">4. 急診</label>
                                    <div class="conditional-box" id="box-health4">
                                        <input type="text" class="form-control" name="急診疾病原因" placeholder="請填寫送急診之疾病或原因">
                                    </div>
                                </div>

                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="身體健康狀況" id="health5" value="其他">
                                    <label class="form-check-label" for="health5">5. 其他</label>
                                    <div class="conditional-box" id="box-health5">
                                        <input type="text" class="form-control" name="身體狀況其他說明" placeholder="請填寫其他身體狀況說明">
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- 二、生活作息 -->
                        <div class="mb-5">
                            <h4 class="section-title"><i class="fa-solid fa-bed me-2"></i>二、生活作息</h4>
                            <div class="d-flex flex-column gap-3">
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="生活作息" id="routine1" value="穩定" checked>
                                    <label class="form-check-label" for="routine1">1. 穩定</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="生活作息" id="routine2" value="夜間易醒 睡眠品質不佳">
                                    <label class="form-check-label" for="routine2">2. 夜間易醒 睡眠品質不佳</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="生活作息" id="routine3" value="日夜顛倒">
                                    <label class="form-check-label" for="routine3">3. 日夜顛倒</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="生活作息" id="routine4" value="其他">
                                    <label class="form-check-label" for="routine4">4. 其他</label>
                                    <div class="conditional-box" id="box-routine4">
                                        <input type="text" class="form-control" name="生活作息其他說明" placeholder="請填寫其他生活作息狀況">
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- 三、飲食 -->
                        <div class="mb-5">
                            <h4 class="section-title"><i class="fa-solid fa-utensils me-2"></i>三、飲食</h4>
                            <div class="row g-2">
                                <div class="col-6 col-md-4">
                                    <div class="form-check p-3 border rounded-3 bg-light h-100">
                                        <input class="form-check-input" type="radio" name="飲食狀況" id="diet1" value="正常" checked>
                                        <label class="form-check-label fw-medium" for="diet1">1. 正常</label>
                                    </div>
                                </div>
                                <div class="col-6 col-md-4">
                                    <div class="form-check p-3 border rounded-3 bg-light h-100">
                                        <input class="form-check-input" type="radio" name="飲食狀況" id="diet2" value="少量">
                                        <label class="form-check-label fw-medium" for="diet2">2. 少量</label>
                                    </div>
                                </div>
                                <div class="col-6 col-md-4">
                                    <div class="form-check p-3 border rounded-3 bg-light h-100">
                                        <input class="form-check-input" type="radio" name="飲食狀況" id="diet3" value="微量">
                                        <label class="form-check-label fw-medium" for="diet3">3. 微量</label>
                                    </div>
                                </div>
                                <div class="col-6 col-md-4">
                                    <div class="form-check p-3 border rounded-3 bg-light h-100">
                                        <input class="form-check-input" type="radio" name="飲食狀況" id="diet4" value="食慾好">
                                        <label class="form-check-label fw-medium" for="diet4">4. 食慾好</label>
                                    </div>
                                </div>
                                <div class="col-6 col-md-4">
                                    <div class="form-check p-3 border rounded-3 bg-light h-100">
                                        <input class="form-check-input" type="radio" name="飲食狀況" id="diet5" value="食慾差">
                                        <label class="form-check-label fw-medium" for="diet5">5. 食慾差</label>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- 四、疼痛情形 -->
                        <div class="mb-5">
                            <h4 class="section-title"><i class="fa-solid fa-face-frown-open me-2"></i>四、疼痛情形</h4>
                            <div class="d-flex flex-column gap-3">
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="疼痛情形" id="pain1" value="無" checked>
                                    <label class="form-check-label" for="pain1">1. 無</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="疼痛情形" id="pain2" value="有(陳年舊疾)">
                                    <label class="form-check-label" for="pain2">2. 有 (陳年舊疾)</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="疼痛情形" id="pain3" value="有(新的疼痛)">
                                    <label class="form-check-label" for="pain3">3. 有 (新的疼痛)</label>
                                    <!-- 新增：新疼痛說明輸入框 -->
                                    <div class="conditional-box" id="box-pain3">
                                        <input type="text" class="form-control" name="新疼痛說明" placeholder="請填寫疼痛部位及狀況（例如：腰部痠痛、關節疼痛等）">
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- 五、服務品質 -->
                        <div class="mb-5">
                            <h4 class="section-title"><i class="fa-solid fa-star-half-stroke me-2"></i>五、服務品質</h4>
                            <p class="text-muted small mb-3"><i class="fa-solid fa-circle-info me-1"></i>評分範圍包含：<strong>態度、服務品質、準時性</strong>等綜合表現。</p>
                            <div class="d-flex flex-column gap-3">
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="服務品質" id="service1" value="良好" checked>
                                    <label class="form-check-label" for="service1">1. 良好</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="服務品質" id="service2" value="尚可">
                                    <label class="form-check-label" for="service2">2. 尚可</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="服務品質" id="service3" value="不佳">
                                    <label class="form-check-label" for="service3">3. 不佳</label>
                                </div>
                            </div>
                        </div>

                        <!-- 六、調整服務需求 -->
                        <div class="mb-5">
                            <h4 class="section-title"><i class="fa-solid fa-sliders me-2"></i>六、調整服務需求</h4>
                            <div class="d-flex flex-column gap-3">
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="調整服務需求" id="adjust1" value="有">
                                    <label class="form-check-label" for="adjust1">1. 有 (請個管回電討論)</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="調整服務需求" id="adjust2" value="無" checked>
                                    <label class="form-check-label" for="adjust2">2. 無 (維持)</label>
                                </div>
                            </div>
                        </div>

                        <!-- 七、喘息需求 -->
                        <div class="mb-5">
                            <h4 class="section-title"><i class="fa-solid fa-calendar-check me-2"></i>七、喘息需求</h4>
                            <div class="d-flex flex-column gap-3">
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="喘息需求" id="respite1" value="有">
                                    <label class="form-check-label" for="respite1">1. 有 (請個管回電討論)</label>
                                    
                                    <!-- 選擇「有」之後展開的 3 個子選項區塊 -->
                                    <div class="conditional-box" id="box-respite">
                                        <p class="fw-bold small text-teal mb-2">請選擇您偏好的聯繫或預約方式：</p>
                                        
                                        <!-- 子選項 (1)：文字輸入欄位 -->
                                        <div class="form-check mb-2">
                                            <input class="form-check-input" type="radio" name="喘息聯繫方式" id="respiteType1" value="文字描述時段" checked>
                                            <label class="form-check-label small" for="respiteType1">(1) 希望聯繫日期 / 時段（文字描述）</label>
                                        </div>
                                        <div class="mb-3" id="subBox-text1" style="display: block;">
                                            <input type="text" class="form-control" name="喘息希望聯繫日期時段文字" placeholder="例如：下週一上午、或隨時皆可">
                                        </div>

                                        <!-- 子選項 (2)：日曆 + 包含起訖的24小時制 -->
                                        <div class="form-check mb-2">
                                            <input class="form-check-input" type="radio" name="喘息聯繫方式" id="respiteType2" value="精確日期時間">
                                            <label class="form-check-label small" for="respiteType2">(2) 直接點選需要喘息的日期及時間 (日曆 / 起訖時間)</label>
                                        </div>
                                        <div class="row g-2 mb-3" id="subBox-datetime" style="display: none;">
                                            <div class="col-md-4">
                                                <label class="form-label text-muted small">選擇日期：</label>
                                                <input type="date" class="form-control" name="喘息預約日期">
                                            </div>
                                            <div class="col-md-4">
                                                <label class="form-label text-muted small">起始時間：</label>
                                                <input type="time" class="form-control" name="喘息起始時間">
                                            </div>
                                            <div class="col-md-4">
                                                <label class="form-label text-muted small">結束時間：</label>
                                                <input type="time" class="form-control" name="喘息結束時間">
                                            </div>
                                        </div>

                                        <!-- 子選項 (3)：自行填寫空白格 -->
                                        <div class="form-check mb-2">
                                            <input class="form-check-input" type="radio" name="喘息聯繫方式" id="respiteType3" value="自行填寫日期時間">
                                            <label class="form-check-label small" for="respiteType3">(3) 自行填寫需要的日期及時間 (空白格)</label>
                                        </div>
                                        <div class="mb-3" id="subBox-text2" style="display: none;">
                                            <input type="text" class="form-control" name="喘息自行填寫日期時間" placeholder="請自由填寫您需要的喘息日期與時間區段">
                                        </div>

                                    </div>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="喘息需求" id="respite2" value="無" checked>
                                    <label class="form-check-label" for="respite2">2. 無</label>
                                </div>
                            </div>
                        </div>

                        <!-- 八、照顧壓力調查 (新增) -->
                        <div class="mb-5">
                            <h4 class="section-title"><i class="fa-solid fa-scale-balanced me-2"></i>八、照顧壓力調查</h4>
                            <div class="d-flex flex-column gap-3">
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="照顧壓力調查" id="stress1" value="調適良好" checked>
                                    <label class="form-check-label" for="stress1">🟢 <strong>【調適良好】</strong> 目前仍有能力克服照護上的問題。</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="照顧壓力調查" id="stress2" value="出現壓力徵兆">
                                    <label class="form-check-label" for="stress2">🟡 <strong>【出現壓力徵兆】</strong> 處於體力或心理臨界點。</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="照顧壓力調查" id="stress3" value="負荷沉重">
                                    <label class="form-check-label" for="stress3">
                                        🔴 <strong>【負荷沉重】</strong> 心理、身體、經濟或社交已受到嚴重衝擊，處於高風險狀態。<br>
                                        <span class="text-danger fw-bold small mt-1 d-inline-block"><i class="fa-solid fa-triangle-exclamation me-1"></i>強烈建議立即尋求外部專業協助（如撥打關懷專線0800-50-7272、尋求醫療諮商），以維持生活品質。</span>
                                    </label>
                                </div>
                            </div>
                        </div>

                        <!-- 提交按鈕 -->
                        <div class="d-grid mt-4">
                            <button type="submit" class="btn btn-primary-custom btn-lg shadow-sm" id="submitBtn">
                                <i class="fa-solid fa-paper-plane me-2"></i>確認無誤，送出回饋
                            </button>
                        </div>
                    </form>
                </div>

                <!-- 提交成功後的畫面 -->
                <div class="card card-custom p-5 text-center bg-white success-overlay" id="successCard">
                    <div class="mb-4 text-teal">
                        <i class="fa-solid fa-circle-check fa-4x text-success"></i>
                    </div>
                    <h3 class="fw-bold text-dark mb-3">回饋資料已成功送出！</h3>
                    <p class="text-muted mb-4">非常感謝您的填寫與協助。您的回饋已自動傳送至個管員信箱，我們將持續守護長輩的健康與生活品質。</p>
                    <div class="d-grid gap-2 col-md-6 mx-auto">
                        <button class="btn btn-primary-custom" onclick="resetForm()">
                            <i class="fa-solid fa-rotate-right me-2"></i>再次填寫 / 新增回饋
                        </button>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // 共用顯示/隱藏函數，確保絕對有效
        function showEl(id, displayType = 'block') {
            const el = document.getElementById(id);
            if (el) el.style.display = displayType;
        }
        function hideEl(id) {
            const el = document.getElementById(id);
            if (el) el.style.display = 'none';
        }

        // 自動帶入今天日期
        document.getElementById('fillDate').valueAsDate = new Date();

        // 填寫人與個案關係：選擇「其他」
        const relationSelect = document.getElementById('relationSelect');
        const otherRelationInput = document.getElementById('otherRelationInput');
        relationSelect.addEventListener('change', function() {
            if(this.value === '其他') {
                showEl('otherRelationDiv');
                otherRelationInput.setAttribute('required', 'required');
            } else {
                hideEl('otherRelationDiv');
                otherRelationInput.removeAttribute('required');
                otherRelationInput.value = '';
            }
        });

        // 身體健康狀況
        const healthRadios = document.querySelectorAll('input[name="身體健康狀況"]');
        healthRadios.forEach(radio => {
            radio.addEventListener('change', function() {
                hideEl('box-health2'); hideEl('box-health3'); hideEl('box-health4'); hideEl('box-health5');
                if(this.id === 'health2') showEl('box-health2');
                if(this.id === 'health3') showEl('box-health3');
                if(this.id === 'health4') showEl('box-health4');
                if(this.id === 'health5') showEl('box-health5');
            });
        });

        // 生活作息
        const routineRadios = document.querySelectorAll('input[name="生活作息"]');
        routineRadios.forEach(radio => {
            radio.addEventListener('change', function() {
                if(this.id === 'routine4') showEl('box-routine4');
                else hideEl('box-routine4');
            });
        });

        // 疼痛情形 
        const painRadios = document.querySelectorAll('input[name="疼痛情形"]');
        painRadios.forEach(radio => {
            radio.addEventListener('change', function() {
                if(this.id === 'pain3') showEl('box-pain3');
                else hideEl('box-pain3');
            });
        });

        // 喘息需求
        const respiteRadios = document.querySelectorAll('input[name="喘息需求"]');
        respiteRadios.forEach(radio => {
            radio.addEventListener('change', function() {
                if (this.id === 'respite1') {
                    showEl('box-respite');
                    // 預設重置為第一個子選項
                    document.getElementById('respiteType1').checked = true;
                    showEl('subBox-text1');
                    hideEl('subBox-datetime');
                    hideEl('subBox-text2');
                } else {
                    hideEl('box-respite');
                }
            });
        });

        // 喘息需求內部：(1) 文字輸入 vs (2) 日曆/起訖時間 vs (3) 空白格自行填寫
        const respiteTypeRadios = document.querySelectorAll('input[name="喘息聯繫方式"]');
        respiteTypeRadios.forEach(radio => {
            radio.addEventListener('change', function() {
                hideEl('subBox-text1');
                hideEl('subBox-datetime');
                hideEl('subBox-text2');

                if(this.id === 'respiteType1') {
                    showEl('subBox-text1');
                } else if(this.id === 'respiteType2') {
                    showEl('subBox-datetime', 'flex'); // row 需使用 flex 保持排版
                } else if(this.id === 'respiteType3') {
                    showEl('subBox-text2');
                }
            });
        });

        // Formspree AJAX 提交處理
        const form = document.getElementById('feedbackForm');
        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin me-2"></i>傳送中...';

            const formData = new FormData(form);

            try {
                const response = await fetch(form.action, {
                    method: 'POST',
                    body: formData,
                    headers: { 'Accept': 'application/json' }
                });

                if (response.ok) {
                    hideEl('formCard');
                    showEl('successCard');
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                } else {
                    alert('送出時發生錯誤，請稍後再試或直接聯繫個管員。');
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '<i class="fa-solid fa-paper-plane me-2"></i>確認無誤，送出回饋';
                }
            } catch (error) {
                alert('網路連線異常，請檢查您的網路狀態。');
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fa-solid fa-paper-plane me-2"></i>確認無誤，送出回饋';
            }
        });

        // 重置表單畫面
        function resetForm() {
            form.reset();
            document.getElementById('fillDate').valueAsDate = new Date();
            
            // 隱藏所有展開區塊
            hideEl('otherRelationDiv');
            hideEl('box-health2'); hideEl('box-health3'); hideEl('box-health4'); hideEl('box-health5');
            hideEl('box-routine4');
            hideEl('box-pain3');
            hideEl('box-respite');
            showEl('subBox-text1');
            hideEl('subBox-datetime');
            hideEl('subBox-text2');
            
            hideEl('successCard');
            showEl('formCard');
            
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = false;
            submitBtn.innerHTML = '<i class="fa-solid fa-paper-plane me-2"></i>確認無誤，送出回饋';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    </script>
</body>
</html>
