<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>家屬近況回報系統</title>
  <!-- 載入 Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <div class="container mt-5 mb-5">
    <div class="row justify-content-center">
      <div class="col-md-8">
        <div class="card shadow-sm">
          <div class="card-header bg-primary text-white">
            <h5 class="mb-0">家屬近況回報與問題詢問</h5>
          </div>
          <div class="card-body">
            
            <!-- 表單開始 -->
            <form id="my-form" action="https://formspree.io/f/mvkkggvn" method="POST">
              
              <!-- 家屬姓名 -->
              <div class="mb-3">
                <label for="familyName" class="form-label">您的姓名 (家屬)</label>
                <input type="text" class="form-control" id="familyName" name="家屬姓名" required>
              </div>

              <!-- 個案姓名 -->
              <div class="mb-3">
                <label for="caseName" class="form-label">個案姓名</label>
                <input type="text" class="form-control" id="caseName" name="個案姓名" required>
              </div>

              <!-- 聯絡信箱 -->
              <div class="mb-3">
                <label for="email" class="form-label">聯絡信箱 (選填，若需回覆請務必填寫)</label>
                <input type="email" class="form-control" id="email" name="email">
              </div>

              <!-- 個案目前狀況 (下拉式選單) -->
              <div class="mb-3">
                <label for="caseStatus" class="form-label">個案目前狀況</label>
                <select class="form-select" id="caseStatus" name="個案目前狀況" required>
                  <option value="" selected disabled>請選擇最符合的狀況</option>
                  <option value="狀況穩定，維持目前服務">狀況穩定，維持目前服務</option>
                  <option value="近期有就醫或出入醫院，需調整服務">近期有就醫或出入醫院，需調整服務</option>
                  <option value="個案體況改變，希望評估增加服務項目">個案體況改變，希望評估增加服務項目</option>
                  <option value="主要照顧者壓力較大，需安排喘息服務">主要照顧者壓力較大，需安排喘息服務</option>
                  <option value="其他（請於下方說明）">其他（請於下方說明）</option>
                </select>
              </div>

              <!-- 預設隱藏的「其他狀況」輸入框 -->
              <div class="mb-3 d-none" id="otherStatusDiv">
                <label for="otherStatus" class="form-label">請簡述其他狀況</label>
                <input type="text" class="form-control" id="otherStatus" name="其他狀況說明">
              </div>

              <!-- 近況回報/留言 -->
              <div class="mb-3">
                <label for="message" class="form-label">近況更新或需協助事項</label>
                <textarea class="form-control" id="message" name="留言內容" rows="5" required></textarea>
              </div>

              <!-- 送出按鈕 -->
              <button type="submit" class="btn btn-primary w-100">送出回報</button>
              
              <!-- 用來顯示成功或失敗的訊息區塊 -->
              <p id="my-form-status" class="mt-3 text-center fw-bold"></p>
            </form>
            <!-- 表單結束 -->

          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 互動與送出邏輯腳本 -->
  <script>
    document.addEventListener("DOMContentLoaded", function() {
      
      // --- 1. 下拉選單動態顯示「其他」欄位邏輯 ---
      const caseStatusSelect = document.getElementById("caseStatus");
      const otherStatusDiv = document.getElementById("otherStatusDiv");
      const otherStatusInput = document.getElementById("otherStatus");

      caseStatusSelect.addEventListener("change", function() {
        if (this.value === "其他（請於下方說明）") {
          otherStatusDiv.classList.remove("d-none");
          otherStatusInput.setAttribute("required", "");
        } else {
          otherStatusDiv.classList.add("d-none");
          otherStatusInput.removeAttribute("required");
          otherStatusInput.value = ""; 
        }
      });

      // --- 2. AJAX 不跳轉送出邏輯 ---
      const form = document.getElementById("my-form");
      const status = document.getElementById("my-form-status");

      async function handleSubmit(event) {
        event.preventDefault();
        const data = new FormData(event.target);
        
        // 改變按鈕狀態避免重複點擊
        const btn = form.querySelector('button[type="submit"]');
        btn.disabled = true;
        btn.innerText = "處理中...";

        fetch(event.target.action, {
          method: form.method,
          body: data,
          headers: { 'Accept': 'application/json' }
        }).then(response => {
          if (response.ok) {
            status.innerHTML = "回報已成功送出！我們會盡快處理。";
            status.className = "mt-3 text-center fw-bold text-success";
            form.reset();
            // 重置動態欄位狀態
            otherStatusDiv.classList.add("d-none");
            otherStatusInput.removeAttribute("required");
          } else {
            response.json().then(data => {
              if (Object.hasOwn(data, 'errors')) {
                status.innerHTML = data["errors"].map(error => error["message"]).join(", ");
              } else {
                status.innerHTML = "糟糕！送出表單時發生問題。";
              }
              status.className = "mt-3 text-center fw-bold text-danger";
            })
          }
        }).catch(error => {
          status.innerHTML = "糟糕！送出表單時發生網路問題。";
          status.className = "mt-3 text-center fw-bold text-danger";
        }).finally(() => {
          // 恢復按鈕狀態
          btn.disabled = false;
          btn.innerText = "送出回報";
        });
      }
      form.addEventListener("submit", handleSubmit);
    });
  </script>
</body>
</html>
